<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypePeek</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="tp-app">
    <header class="tp-header">
      <div class="tp-brand">
        <img src="assets/icon32.png" alt="" class="tp-logo">
        <div>
          <h1 class="tp-title">TypePeek</h1>
          <p class="tp-subtitle">Typography research</p>
        </div>
      </div>
      <span class="tp-count" id="record-count">0 records</span>
      <button type="button" class="tp-theme-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <div class="tp-toolbar">
      <input type="search" id="search-input" class="tp-search" placeholder="Search fonts, sites, tags...">
      <select id="group-filter" class="tp-select">
        <option value="">All groups</option>
      </select>
    </div>

    <div class="tp-selection-bar" id="selection-bar" hidden>
      <label class="tp-checkbox-label">
        <input type="checkbox" id="select-all-checkbox">
        <span id="selection-count">0 selected</span>
      </label>
      <button type="button" class="tp-btn tp-btn-primary tp-btn-sm" id="export-zip-btn">Export ZIP</button>
      <button type="button" class="tp-btn tp-btn-secondary tp-btn-sm" id="compare-btn" hidden>Compare</button>
    </div>

    <main class="tp-list" id="record-list" aria-live="polite"></main>

    <div class="tp-empty" id="empty-state">
      <div class="tp-empty-icon">Ag</div>
      <p class="tp-empty-title">No saved records yet</p>
      <p class="tp-empty-hint">Hover over text on any page and click the Save button in the tooltip.</p>
    </div>

    <footer class="tp-footer">
      <div class="tp-footer-left">
        <button type="button" class="tp-text-btn" id="export-all-btn">Export all JSON</button>
        <button type="button" class="tp-text-btn tp-danger" id="clear-all-btn">Clear all</button>
      </div>
      <div class="tp-sync" id="sync-section">
        <span class="tp-sync-label" id="sync-status">Sync off</span>
        <label class="tp-toggle" title="Enable cloud sync">
          <input type="checkbox" id="sync-toggle">
          <span class="tp-toggle-track"></span>
        </label>
      </div>
    </footer>
  </div>

  <div class="tp-compare-overlay" id="compare-overlay" hidden>
    <div class="tp-compare-modal">
      <div class="tp-compare-header">
        <h2>Font Comparison</h2>
        <button type="button" class="tp-icon-btn tp-compare-close" id="compare-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="tp-compare-body" id="compare-body"></div>
    </div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
