<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TypePeek A Test Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      max-width: 720px;
      margin: 60px auto;
      padding: 0 24px;
      line-height: 1.6;
      color: #1a1a1a;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      color: #111;
    }
    p {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Typography is the craft of endowing human language with a durable visual form.</h1>
  <p>Hover over text to inspect fonts. Use the floating toggle in the bottom-right corner to turn TypePeek on or off.</p>
</body>
</html>
